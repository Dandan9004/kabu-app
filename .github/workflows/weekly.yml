# Saturday 5:00 JST: count coverage, pick the 10 (max 5 per industry), write dossiers for the Claude routine.
name: weekly
on:
  schedule:
    - cron: "7 20 * * 5"    # Friday 20:07 UTC = Saturday 5:07 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone -q --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pipeline/out && rm -rf pipeline/out/.git || mkdir -p pipeline/out
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - working-directory: pipeline
        run: python -m kabu.pipeline weekly
      - name: Commit the dossiers
        run: |
          git config user.name "kabu-bot"
          git config user.email "kabu-bot@users.noreply.github.com"
          git add pipeline/dossiers
          git commit -m "今週の材料 $(date +%F)" && git push || echo "nothing new"
